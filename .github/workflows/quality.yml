name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coursehub_e2e_test
          POSTGRES_USER: coursehub
          POSTGRES_PASSWORD: coursehub-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursehub -d coursehub_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 5432
      E2E_DB_NAME: coursehub_e2e_test
      E2E_DB_USER: coursehub
      E2E_DB_PASSWORD: coursehub-ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Build application
        run: npm run build

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
